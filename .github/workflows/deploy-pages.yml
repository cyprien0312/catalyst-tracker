name: Deploy docs to Pages

# Deploys the docs/ dashboard to GitHub Pages on a schedule instead of on every
# state commit. The local cron pushes state + dashboard updates every few minutes;
# deploying on each push raced concurrent deployments and produced spurious
# "Deployment cancelled" failures. A serialized, scheduled deploy avoids that.
on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:           # allow manual deploys

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time. Do NOT cancel an in-progress deploy;
# superseded *queued* runs are cancelled cleanly (no failure email).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true   # creates the site as build_type: workflow if Pages is not yet enabled
      # configure-pages only *creates* a site; it never converts an existing
      # legacy (deploy-from-branch) site, and neither GITHUB_TOKEN nor the
      # repo's fine-grained PAT is allowed to PUT /pages (403). While
      # build_type is "legacy", every cron state push triggers the built-in
      # "pages build and deployment" workflow and concurrent runs race and
      # fail. The switch must be flipped once by hand: repo Settings → Pages
      # → Build and deployment → Source → "GitHub Actions". This step only
      # warns while that hasn't happened.
      - name: Check Pages source is GitHub Actions
        run: |
          build_type=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            | jq -r '.build_type // "unknown"')
          echo "Pages build_type: $build_type"
          if [ "$build_type" = "legacy" ]; then
            echo "::warning::Pages source is still 'deploy from branch'; the built-in pages workflow races cron pushes and fails intermittently. Flip Settings → Pages → Source to 'GitHub Actions'."
          fi
      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
