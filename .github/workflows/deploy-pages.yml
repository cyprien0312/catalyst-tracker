name: Deploy docs to Pages

# Deploys the docs/ dashboard to GitHub Pages on a schedule instead of on every
# state commit. The local cron pushes state + dashboard updates every few minutes;
# deploying on each push raced concurrent deployments and produced spurious
# "Deployment cancelled" failures. A serialized, scheduled deploy avoids that.
on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:           # allow manual deploys

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time. Do NOT cancel an in-progress deploy;
# superseded *queued* runs are cancelled cleanly (no failure email).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true   # creates the site as build_type: workflow if Pages is not yet enabled
      # configure-pages only *creates* a site; it never converts an existing
      # legacy (deploy-from-branch) site. While build_type is "legacy", every
      # cron state push triggers the built-in "pages build and deployment"
      # workflow, and concurrent runs race and fail. Force build_type here so
      # only this serialized workflow deploys.
      - name: Force Pages source to GitHub Actions
        run: |
          http_code=$(curl -s -o /tmp/pages_resp.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}')
          echo "PUT /pages -> $http_code"
          cat /tmp/pages_resp.json
          test "$http_code" = "204"
      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
