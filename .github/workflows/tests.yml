name: tests

on:
  push:
    branches: [main]
    paths-ignore:
      - 'state/**'
      - 'docs/**'
      - '.github/workflows/catalyst*.yml'
      - '.github/workflows/keepalive.yml'
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -v
