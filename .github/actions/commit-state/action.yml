name: commit-state
description: Commit state + dashboard files with pull --rebase retries to survive concurrent runs.

inputs:
  message:
    description: Commit message
    required: true
  files:
    description: Space-separated file paths to add
    required: false
    default: "state/tracker.sqlite docs/index.html docs/data/status.json"
  retries:
    description: Number of push attempts
    required: false
    default: "5"

runs:
  using: composite
  steps:
    - name: Commit and push with rebase retries
      shell: bash
      env:
        COMMIT_MESSAGE: ${{ inputs.message }}
        COMMIT_FILES: ${{ inputs.files }}
        MAX_RETRIES: ${{ inputs.retries }}
      run: |
        set -e
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add $COMMIT_FILES || true
        if git diff --cached --quiet; then
          echo "nothing to commit"
          exit 0
        fi
        git commit -m "$COMMIT_MESSAGE"
        for attempt in $(seq 1 "$MAX_RETRIES"); do
          if git push origin HEAD; then
            echo "pushed on attempt $attempt"
            exit 0
          fi
          echo "push attempt $attempt failed, fetching and rebasing..."
          git fetch origin
          git rebase origin/${GITHUB_REF_NAME:-main} || { git rebase --abort || true; exit 1; }
          sleep $((attempt * 2))
        done
        echo "exhausted $MAX_RETRIES push attempts" >&2
        exit 1
